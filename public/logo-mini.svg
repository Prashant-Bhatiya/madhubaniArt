<svg width="128" height="128" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="miniBrushGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F6CB68" />
      <stop offset="50%" stopColor="#D48B14" />
      <stop offset="100%" stopColor="#8D4A0D" />
    </linearGradient>
    <linearGradient id="miniMadderRed" x1="0%" y1="0%" x2="100%" y2="100%">
