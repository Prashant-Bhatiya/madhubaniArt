    <line x1="50" y1="90" x2="50" y2="96" />
    <line x1="4" y1="50" x2="10" y2="50" />
    <line x1="90" y1="50" x2="96" y2="50" />
  </g>

  <!-- Fish Motif (Matsya) -->
  <path d="M23 44 C31 35, 44 37, 47 44 C44 51, 31 53, 23 44 Z" fill="none" stroke="#9E2A2B" stroke-width="1.8" />
  <circle cx="28" cy="44" r="1.6" fill="#D48B14" />
