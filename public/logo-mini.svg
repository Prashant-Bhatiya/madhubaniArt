  <line x1="37" y1="39" x2="37" y2="49" stroke="#9E2A2B" stroke-width="1" />
  <line x1="41" y1="41" x2="41" y2="47" stroke="#9E2A2B" stroke-width="1" />
  <path d="M23 44 L18 39 M23 44 L18 49" stroke="#9E2A2B" stroke-width="1.4" />

  <!-- Lotus Motif (Kamal) -->
  <path d="M50 74 C45 65, 38 63, 36 69 C41 76, 48 76, 50 74 Z" fill="#9E2A2B" />
  <path d="M50 74 C55 65, 62 63, 64 69 C59 76, 52 76, 50 74 Z" fill="#9E2A2B" />
  <path d="M50 74 C47 62, 53 62, 50 74 Z" fill="#D48B14" />

