  </defs>

  <!-- Background disc for high visibility on light or dark tabs -->
  <circle cx="50" cy="50" r="48" fill="#FAF6EE" stroke="#D48B14" stroke-width="2" />
  <circle cx="50" cy="50" r="44" stroke="#9E2A2B" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.85" />

  <!-- Solar Rays -->
  <g stroke="#D48B14" stroke-width="1" opacity="0.7">
