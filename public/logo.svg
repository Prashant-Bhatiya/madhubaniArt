<svg width="420" height="90" viewBox="0 0 420 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brushGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F6CB68" />
      <stop offset="50%" stopColor="#D48B14" />
      <stop offset="100%" stopColor="#8D4A0D" />
    </linearGradient>
    <linearGradient id="madderRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#DC4444" />
      <stop offset="60%" stopColor="#9E2A2B" />
      <stop offset="100%" stopColor="#450D0E" />
    </linearGradient>
  </defs>

  <!-- Left Emblem Container (Centered at x=45, y=45) -->
  <g transform="translate(0, 0)">
    <!-- Outer Kachni Dot Border Circle -->
    <circle cx="45" cy="45" r="38" stroke="#D48B14" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.9" />
    <circle cx="45" cy="45" r="34" stroke="#9E2A2B" stroke-width="0.8" opacity="0.6" />

    <!-- Solar Rays -->
    <g stroke="#D48B14" stroke-width="0.8" opacity="0.6">
      <line x1="45" y1="8" x2="45" y2="13" />
      <line x1="45" y1="77" x2="45" y2="82" />
      <line x1="8" y1="45" x2="13" y2="45" />
      <line x1="77" y1="45" x2="82" y2="45" />
    </g>

    <!-- Traditional Fish (Matsya) -->
    <path d="M24 41 C30 33, 41 35, 43 41 C41 47, 30 49, 24 41 Z" fill="none" stroke="#9E2A2B" stroke-width="1.4" />
    <circle cx="28" cy="41" r="1.3" fill="#D48B14" />
    <line x1="31" y1="37" x2="31" y2="45" stroke="#9E2A2B" stroke-width="0.7" />
    <line x1="35" y1="36" x2="35" y2="46" stroke="#9E2A2B" stroke-width="0.7" />
    <line x1="39" y1="38" x2="39" y2="44" stroke="#9E2A2B" stroke-width="0.7" />
    <path d="M24 41 L20 37 M24 41 L20 45" stroke="#9E2A2B" stroke-width="1" />

    <!-- Sacred Lotus (Kamal) -->
    <path d="M45 64 C41 57, 36 55, 34 60 C38 65, 43 65, 45 64 Z" fill="#9E2A2B" opacity="0.85" />
    <path d="M45 64 C49 57, 54 55, 56 60 C52 65, 47 65, 45 64 Z" fill="#9E2A2B" opacity="0.85" />
    <path d="M45 64 C43 54, 47 54, 45 64 Z" fill="#D48B14" />

    <!-- Slanted Artist Paintbrush -->
    <path d="M68 18 L65 15 C63 13, 60 15, 58 16 L43 40 L46 43 L67 23 C68 21, 70 20, 68 18 Z" fill="url(#brushGold)" stroke="#1A1615" stroke-width="0.7" />
    <path d="M43 40 L46 43 L41 48 L38 45 Z" fill="#17565E" stroke="#1A1615" stroke-width="0.7" />
    <path d="M38 45 L41 48 C39 52, 36 55, 33 56 C35 51, 36 48, 38 45 Z" fill="url(#madderRed)" stroke="#1A1615" stroke-width="0.7" />
    <path d="M33 56 C31 60, 27 61, 25 60 C22 59, 21 57, 22 53 C24 50, 29 49, 34 51" fill="none" stroke="#D48B14" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Typography: ART IS ART -->
  <text x="100" y="44" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="28" font-weight="800" fill="#1A1615" letter-spacing="4">ART IS ART</text>

  <!-- Sub-tagline: MADHUBANI ART • INTERIORS • MONIKA -->
  <text x="100" y="66" font-family="'Outfit', -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#D48B14" letter-spacing="2">MADHUBANI ART</text>
  <circle cx="206" cy="63" r="2" fill="#9E2A2B" />
  <text x="216" y="66" font-family="'Outfit', -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#57534E" letter-spacing="2">INTERIORS</text>
  <circle cx="288" cy="63" r="2" fill="#D48B14" />
  <text x="298" y="66" font-family="'Outfit', -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#9E2A2B" letter-spacing="2">BY MONIKA</text>
</svg>
